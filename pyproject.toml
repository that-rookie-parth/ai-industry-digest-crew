[project]
name = "ai-industry-digest-crew"
version = "0.1.0"
description = "A CrewAI workflow that researches and summarizes daily AI industry developments."
authors = [{ name = "Parth Kulshreshtha", email = "kulshreshthaparth@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.201.1,<1.0.0",
    "tavily-python>=0.7.12",
]

[project.scripts]
ai-industry-digest = "ai_industry_digest_crew.main:run"
run_crew = "ai_industry_digest_crew.main:run"
train = "ai_industry_digest_crew.main:train"
replay = "ai_industry_digest_crew.main:replay"
test = "ai_industry_digest_crew.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
